[project]
name = "canary-library"
version = "1.0.0"
description = "场景一：智能图书馆管理系统 —— 请求驱动的 HTTP API + RAG"
requires-python = ">=3.12"
dependencies = [
    "canary-framework[config,web]>=1.2.0,<2",
    # 第二层 HTTP 是一个原生 FastAPI 应用（由我们的 Server 服务），所以 FastAPI 是本项目
    # 自己的依赖，不再从框架的 extra 里来——框架只认 ASGI 协议，不包装任何 web 框架。
    "fastapi>=0.121",
    "sqlmodel==0.0.47",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pgvector==0.5.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
