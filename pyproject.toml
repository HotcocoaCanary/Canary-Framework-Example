[project]
name = "Canary-Agent"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "canary-framework[web]>=0.2.1",
    "sqlmodel[asyncio]>=0.0.22",
    "asyncpg>=0.30.0",
    "pgvector>=0.2.0",
    "litellm>=1.60.0",
    "langgraph>=0.3.0",
    "markitdown>=0.0.1",
    "oss2>=2.19.0",
    "httpx>=0.28.0",
    "nanoid>=2.0.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
