[project]
name = "canary-scenarios"
version = "0.1.0"
description = "canary-framework 多场景能力验证平台"
requires-python = ">=3.12, <3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24"
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# 场景二的守护进程测试是 async 的；场景一的同步测试不受影响
asyncio_mode = "auto"
testpaths = ["apps/library/tests", "apps/telemetry/tests"]
