[project]
name = "canary-pipeline"
version = "1.0.0"
description = "场景四：对账单导入流水线 —— HTTP 接入与队列消费者同进程，两步优雅停机"
requires-python = ">=3.12"
dependencies = [
    "canary-framework[config,web]>=1.1.0,<2",
    # 第二层 HTTP 是一个原生 FastAPI 应用（由我们的 Server 服务）
    "fastapi>=0.121",
    "pydantic>=2.13.4",
]

# 试用尚未发布的扩展包：指向上一级的框架源码（本仓作为框架仓的 examples 子模块时成立）。
# 扩展包发布后删掉这一段，改回版本约束。
[tool.uv.sources]
canary-framework = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
