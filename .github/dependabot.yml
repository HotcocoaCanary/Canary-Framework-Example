version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies]

  - package-ecosystem: uv
    directories: [/library, /telemetry]
    schedule:
      interval: weekly
    groups:
      canary-framework:
        patterns: ["canary-framework"]
      others:
        patterns: ["*"]
        exclude-patterns: ["canary-framework"]
    commit-message:
      prefix: build
    labels: [dependencies]
